App\Entity\Beneficiaire:
  beneficiaire1:
    utilisateur: '@beneficiaire'
    profil: '@profil4'
    debut: <date_create('2020-01-01')>
    gestionnaire: '@gestionnaire'
  beneficiaire2:
    utilisateur: '@beneficiaire-2'
    profil: '@profil1'
    debut: <date_create('2020-01-01')>
    gestionnaire: '@gestionnaire2'
  beneficiaire-decision:
    utilisateur: '@utilisateur-beneficiaire-decision'
    profil: '@profil1'
    debut: <date_create('2020-01-01')>
    gestionnaire: '@gestionnaire'
  ancien-beneficiaire:
    utilisateur: '@utilisateur-ancien-beneficiaire'
    profil: '@profil1'
    debut: <date_create('2020-01-01')>
    fin: <date_create('2020-12-31')>
    gestionnaire: '@gestionnaire'
  # Rattachement bénéficiaire des deux dossiers de référence, sans date de fin,
  # pour qu'ils restent visibles dans la liste des bénéficiaires en cours.
  beneficiaire-dossier-administratif:
    utilisateur: '@etudiant-dossier-administratif'
    profil: '@profil12'
    debut: <date_create('-1 year')>
    gestionnaire: '@gestionnaire'
  beneficiaire-parcours-academique:
    utilisateur: '@etudiant-parcours-academique'
    profil: '@profil12'
    debut: <date_create('-1 year')>
    gestionnaire: '@gestionnaire'
