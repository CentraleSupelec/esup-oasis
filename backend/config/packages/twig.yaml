twig:
  default_path: '%kernel.project_dir%/templates'
  globals:
    publicRootDir: '%kernel.project_dir%/public'
    frontUrl: '%env(FRONT_URL)%'
    backUrl: '%env(BACK_URL)%'
    # Identité de l'établissement sur la décision d'aménagements (cf. decision.yaml)
    etablissementNom: '%env(default:decision.etablissement_nom:ETABLISSEMENT_NOM)%'
    serviceNom: '%env(default:decision.service_nom:SERVICE_NOM)%'
    etablissementVille: '%env(default:decision.etablissement_ville:ETABLISSEMENT_VILLE)%'
    etablissementAdresseRue: '%env(default:decision.etablissement_adresse_rue:ETABLISSEMENT_ADRESSE_RUE)%'
    etablissementAdressePostale: '%env(default:decision.etablissement_adresse_postale:ETABLISSEMENT_ADRESSE_POSTALE)%'
    afficherServiceReferent: '%env(default:decision.afficher_service_referent:bool:AFFICHER_SERVICE_REFERENT)%'
    tribunalAdministratifVille: '%env(default:decision.tribunal_administratif_ville:TRIBUNAL_ADMINISTRATIF_VILLE)%'
    tribunalAdministratifAdresse: '%env(default:decision.tribunal_administratif_adresse:TRIBUNAL_ADMINISTRATIF_ADRESSE)%'
  paths:
    '%kernel.project_dir%/public/css': 'styles'

when@test:
  twig:
    strict_variables: true
